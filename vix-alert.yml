name: VIX Lookout Alert

on:
  schedule:
    # Every 30 minutes. GitHub cron is UTC. VIX only updates during US
    # market hours, so off-hours runs are cheap no-ops (same close value).
    - cron: "*/30 * * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the updated vix_seen.json

jobs:
  check-vix:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vix-alert
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run VIX check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python vix_alerts.py

      - name: Commit updated state
        run: |
          git config user.name "vix-alert-bot"
          git config user.email "actions@github.com"
          git add vix_seen.json
          git diff --staged --quiet || git commit -m "Update vix_seen.json [skip ci]"
          git push
